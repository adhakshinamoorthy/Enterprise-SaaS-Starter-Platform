services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports: ["1433:1433"]
    healthcheck: { test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1'"], interval: 10s, timeout: 5s, retries: 15 }
    volumes: ["sql-data:/var/opt/mssql"]
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["redis-data:/data"]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: saas, RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}" }
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "check_running"], interval: 10s, timeout: 5s, retries: 10 }
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
volumes: { sql-data: {}, redis-data: {}, rabbit-data: {} }
